# Despliegue de ServiceRequest en k3s (namespace quickpatch), igual en QA y producción.
# Primer despliegue: crear el Secret service-request-secretos (deploy/k8s/README.md), reemplazar <vm-mensajeria> por la IP de
# Kafka del ambiente y aplicar este archivo con `kubectl apply -f deploy/k8s/service-request.yaml`.
# Después, el pipeline actualiza la imagen con `kubectl set image deployment/service-request "*=<imagen>"`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-request-config
  namespace: quickpatch
  labels: { app: service-request }
data:
  Jwt__Issuer: "quickpatch-identity"
  Jwt__Audience: "quickpatch"
  Kafka__BootstrapServers: "<vm-mensajeria>:9092"
  Outbox__PublisherRole: "service_request_outbox"
  # Conteos de todos los tenants para el admin_plataforma (DD 10.4): rol de db/roles.sql, adoptado con SET LOCAL ROLE.
  Platform__ReadRole: "service_request_platform"
  Kafka__ConsumerGroupId: "service-request-service"
  Coverage__MinLatitude: "4.45"
  Coverage__MaxLatitude: "4.85"
  Coverage__MinLongitude: "-74.25"
  Coverage__MaxLongitude: "-73.98"
  # Consulta interna por lote de nombres (identity-internal.v1.yaml); por el Service de k8s, sin pasar por el gateway.
  Identity__BaseUrl: "http://identity.quickpatch.svc.cluster.local:8080"
  Identity__Timeout: "00:00:02"
  # Geocodificación propia (ADR-024, RIE-02): Nominatim corre en la VM de datos de cada ambiente (playbook deploy-nominatim.yml
  # de quickpatch). El playbook reemplaza <vm-datos>. Si no responde, la solicitud con addressText da 422 direccion-no-encontrada.
  Geocoding__NominatimUrl: "http://<vm-datos>:8088"
  # Cotizaciones (RF-34, RF-35, SCRUM-488): plazo para responder (RN-Q8, DEP-16) y rol de db/roles.sql con el que el proceso
  # programado encuentra las vencidas de todos los tenants (P-06, RN-Q6).
  Quotes__Ttl: "1.00:00:00"
  Quotes__SchedulerRole: "service_request_scheduler"
  # Redis de la VM de datos (coordinación del vencimiento, DD 7.13): usuario ACL service-request, solo claves service-request:*.
  Redis__Endpoint: "<vm-datos>:6379"
  Redis__User: "service-request"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-request
  namespace: quickpatch
  labels: { app: service-request }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: service-request }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: service-request }
    spec:
      securityContext:
        runAsNonRoot: true
        # La imagen declara USER app (por nombre); Kubernetes necesita el UID para verificar que no es root.
        runAsUser: 1654
        runAsGroup: 1654
      initContainers:
        # Migraciones (EF Core bundle) con el rol service_request_migrator, dueño de las tablas (DD 10.2).
        - name: migraciones
          image: ghcr.io/arqui-202630/quickpatch-service-request:pendiente
          command: ["/app/efbundle", "--connection", "$(MIGRATOR_CONNECTION)"]
          env:
            - name: MIGRATOR_CONNECTION
              valueFrom: { secretKeyRef: { name: service-request-secretos, key: migrator-connection } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      containers:
        - name: service-request
          image: ghcr.io/arqui-202630/quickpatch-service-request:pendiente
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: service-request-config }
          env:
            - name: ConnectionStrings__ServiceRequest
              valueFrom: { secretKeyRef: { name: service-request-secretos, key: app-connection } }
            - name: Jwt__PublicKeyPem
              valueFrom: { secretKeyRef: { name: service-request-secretos, key: jwt-public-key } }
            - name: Redis__Password
              valueFrom: { secretKeyRef: { name: service-request-secretos, key: redis-password } }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          # Pendiente de medición (Documento de Infraestructura, 5.6); límite inicial dentro del presupuesto de VM3.
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: service-request
  namespace: quickpatch
  labels: { app: service-request }
spec:
  selector: { app: service-request }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# El gateway quita /api y reenvía a Traefik (NodePort 30080); Traefik elige el servicio por la ruta del contrato.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service-request
  namespace: quickpatch
spec:
  rules:
    - http:
        paths:
          - { path: /v1/service-requests, pathType: Prefix, backend: { service: { name: service-request, port: { name: http } } } }
          # Lista del técnico (contrato 1.2.0). Matching publica /v1/technicians/me; Traefik prioriza la regla más larga.
          - { path: /v1/technicians/me/service-requests, pathType: Prefix, backend: { service: { name: service-request, port: { name: http } } } }
          # Panel operativo (contrato 1.4.0). Identity publica /v1/platform; Traefik prioriza la regla más larga.
          - { path: /v1/admin/service-requests, pathType: Prefix, backend: { service: { name: service-request, port: { name: http } } } }
          - { path: /v1/platform/service-requests, pathType: Prefix, backend: { service: { name: service-request, port: { name: http } } } }
